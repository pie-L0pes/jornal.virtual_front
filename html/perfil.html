<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>

    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="../css/global/global.css">
    <link rel="stylesheet" href="../css/global/root.css">
    <link rel="stylesheet" href="/css/notificacoes.css">
    <link rel="stylesheet" href="/css/publicacao-detalhes.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="bolinhas bolinhas1"></div>
    <div class="bolinhas bolinhas2"></div>
    <div class="bolinhas bolinhas3"></div>

    <header class="header-global">
        <div class="logo">
            <i class="fa-solid fa-newspaper"></i>
            <h2>Jornal<span>Online</span></h2>
        </div>

        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false"
            aria-controls="navPrincipal">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-principal" id="navPrincipal">
            <a href="/html/inicio.html">Início</a>
            <a href="/html/feed.html">Feed</a>
            <a href="/html/perfil.html" class="ativo">Minha Conta</a>
            <a href="/html/configuracoes.html">Configurações</a>
            <button type="button" class="btn-notificacoes" id="btnNotificacoes" aria-label="Abrir notificações"
                aria-expanded="false" aria-controls="painelNotificacoes">
                <i class="fa-regular fa-bell"></i>
                <span id="contadorNotificacoes" class="contador-notificacoes" hidden>0</span>
            </button>
        </nav>
    </header>

    <main class="pagina-perfil">

        <section class="perfil">

            <div class="topo">
                <img id="banner" src="/img/template-padrao.png" alt="Banner do perfil">
            </div>

            <img id="foto" class="foto" src="/img/avatar-padrao.png" alt="Foto de perfil">

            <div class="conteudo">

                <h1 class="nome" id="nome">Carregando...</h1>

                <p class="info">
                    <strong>REDE:</strong>
                    <span id="rede">Carregando...</span>
                </p>

                <p class="descricao" id="descricao">
                    Carregando descrição...
                </p>

                <div class="categoria" id="categoria">
                    Usuário
                </div>

                <div class="estatisticas">

                    <div class="card" data-atividade="publicacoes" role="button" tabindex="0">
                        <h2 id="totalPublicacoes">0</h2>
                        <span>Publicações</span>
                    </div>

                    <div class="card" data-atividade="comentarios" role="button" tabindex="0">
                        <h2 id="totalComentarios">0</h2>
                        <span>Comentários</span>
                    </div>

                    <div class="card" data-atividade="curtidas" role="button" tabindex="0">
                        <h2 id="totalCurtidas">0</h2>
                        <span>Curtidas</span>
                    </div>

                </div>

                <button id="btnEditarPerfil" type="button" hidden>
                    Editar Perfil
                </button>

            </div>

        </section>

        <section class="painel-atividades-perfil">

            <div class="abas-atividades-perfil">

                <button type="button" class="aba-atividade ativa" data-atividade="publicacoes">
                    Publicações
                </button>

                <button type="button" class="aba-atividade" data-atividade="comentarios">
                    Comentários
                </button>

                <button type="button" class="aba-atividade" data-atividade="curtidas">
                    Curtidas
                </button>

            </div>

            <div id="atividadesPerfil"></div>

        </section>

    </main>

    <div class="modal-fundo" id="modalFundo">

        <div class="modal">

            <button class="fechar-modal" onclick="fecharModal()" type="button">
                ×
            </button>

            <h2>Editar Perfil</h2>

            <div class="imagens-modal">

                <div class="imagem-modal">

                    <label>Foto de Perfil</label>

                    <div class="preview-foto">
                        <img id="previewFoto" src="/img/avatar-padrao.png" alt="Pré-visualização da foto de perfil">
                    </div>

                    <label class="botao-imagem">
                        Escolher imagem
                        <input type="file" id="inputFoto" accept="image/*">
                    </label>

                </div>

                <div class="imagem-modal banner-modal">

                    <label>Foto de Banner</label>

                    <div class="preview-banner">
                        <img id="previewBanner" src="/img/template-padrao.png" alt="Pré-visualização do banner">
                    </div>

                    <label class="botao-imagem">
                        Escolher imagem
                        <input type="file" id="inputBanner" accept="image/*">
                    </label>

                </div>

            </div>

            <div class="campo-modal">
                <label for="inputNome">Nome</label>
                <input type="text" id="inputNome" maxlength="60" placeholder="Seu nome" disabled>
            </div>

            <div class="campo-modal">
                <label for="inputDescricao">Descrição</label>
                <textarea id="inputDescricao" placeholder="Fale um pouco sobre você..."></textarea>
            </div>

            <div class="campo-modal campo-privacidade">
                <label for="mostrarCurtidas">
                    <input type="checkbox" id="mostrarCurtidas">
                    Mostrar minhas curtidas no perfil
                </label>
            </div>

            <div class="botoes-modal">

                <button class="botao-salvar" onclick="salvarPerfil()" type="button">
                    Salvar Alterações
                </button>

                <button class="botao-cancelar" onclick="fecharModal()" type="button">
                    Cancelar
                </button>

            </div>

        </div>

    </div>

    <div class="notificacoes-overlay" id="notificacoesOverlay" hidden></div>

    <aside class="painel-notificacoes" id="painelNotificacoes" aria-label="Notificações" aria-hidden="true">
        <div class="notificacoes-cabecalho">
            <div>
                <h2>Notificações</h2>
            </div>

            <button type="button" id="fecharNotificacoes" class="fechar-notificacoes" aria-label="Fechar notificações">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="notificacoes-ferramentas">
            <span id="resumoNotificacoes">Nenhuma notificação</span>
            <button type="button" id="marcarTodasLidas">Marcar todas como lidas</button>
        </div>

        <div class="lista-notificacoes" id="listaNotificacoes">
            <div class="notificacoes-vazio">Carregando notificações...</div>
        </div>
    </aside>

    <script src="../js/global/tema.js"></script>
    <script src="/js/perfil.js"></script>
    <script src="/js/global/header-scroll.js" defer></script>
    <script src="/js/notificacoes.js" defer></script>
    <script src="/js/publicacao-detalhes.js"></script>

</body>

</html>
